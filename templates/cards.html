<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专属牌 · 三国杀 DIY 武将图鉴</title>
<meta name="description" content="武将专属锦囊与专属装备一览，含规则原文与所属武将。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/style.css?v={{BUILD}}">
<script src="../assets/common.js?v={{BUILD}}"></script>
</head>
<body data-build="{{BUILD}}">
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="../"><span class="logo-mark">杀</span>DIY 武将图鉴<small>身份局</small></a>
    <nav class="nav" aria-label="主导航">
      <a href="../">武将</a><a href="./" aria-current="page">专属牌</a><a href="../tools/">模拟器</a><a href="../session/">牌局</a><a href="../draft/">选将</a>
    </nav>
    <form class="search" action="../" method="get" role="search">
      <label class="sr-only" for="q">搜索武将</label>
      <span class="icon" aria-hidden="true">⌕</span>
      <input id="q" name="q" type="search" autocomplete="off" placeholder="名称、拼音、首字母、称号或技能…" enterkeyhint="search">
      <kbd>Ctrl K</kbd>
    </form>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="切换明暗主题">☀</button>
  </div>
</header>

<main>
  <div class="page-head">
    <div>
      <h1>专属牌</h1>
      <p>只属于特定武将的锦囊与装备。锦囊规则取自《三国杀身份场新概念介绍 v4》，装备的入场方式取自武将技能。</p>
    </div>
  </div>
  {{CARDS}}
</main>

<footer class="site-footer">
  <div class="inner">
    <span>非官方爱好者项目，代码以 MIT 协议开源。卡面图片与“三国杀”相关名称版权归游卡桌游及原画师所有。</span>
  </div>
</footer>
</body>
</html>
