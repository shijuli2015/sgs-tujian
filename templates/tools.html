<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能模拟器 · 三国杀 DIY 武将图鉴</title>
<meta name="description" content="三国杀 DIY 武将技能模拟器：飒然、骁武、武佑等随机技能的在线模拟，以及锦囊谱。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/style.css?v={{BUILD}}">
<script src="../assets/common.js?v={{BUILD}}"></script>
</head>
<body data-build="{{BUILD}}">
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="../"><span class="logo-mark">杀</span>DIY 武将图鉴<small>身份局</small></a>
    <nav class="nav" aria-label="主导航"><a href="../">武将</a><a href="./" aria-current="page">模拟器</a><a href="../session/">牌局</a><a href="../draft/">选将</a></nav>
    <form class="search" action="../" method="get" role="search">
      <label class="sr-only" for="q">搜索武将</label>
      <span class="icon" aria-hidden="true">⌕</span>
      <input id="q" name="q" type="search" autocomplete="off" placeholder="名称、拼音、首字母、称号或技能…" enterkeyhint="search">
      <kbd>Ctrl K</kbd>
    </form>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="切换明暗主题">☀</button>
  </div>
</header>

<main>
  <div class="page-head">
    <div>
      <h1>技能模拟器</h1>
      <p>带随机效果的技能可以在这里试玩；武将详情页的技能旁也有入口。</p>
    </div>
  </div>
  <div class="tools">{{TOOLS}}</div>
</main>

<footer class="site-footer">
  <div class="inner">
    <span>非官方爱好者项目，代码以 MIT 协议开源。卡面图片与“三国杀”相关名称版权归游卡桌游及原画师所有。</span>
  </div>
</footer>
</body>
</html>
